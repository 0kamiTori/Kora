name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  documentation-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_foundation.py
# Application builds and tests are added when real projects are initialized.
