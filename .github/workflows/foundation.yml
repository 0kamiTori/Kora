name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  documentation-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_foundation.py
      - run: |
          python -m pip install --only-binary=:all: -r scripts/requirements-contracts.txt
      - run: python scripts/validate_registration_contract.py
